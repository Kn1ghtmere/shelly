[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shelly"
version = "0.1.0"
description = "A beginner-friendly shell you talk to in plain English."
readme = "README.md"
requires-python = ">=3.11"

[project.scripts]
shelly = "shelly.ui.terminal:main"

[tool.setuptools.packages.find]
include = ["shelly*"]

[tool.setuptools.package-data]
shelly = ["data/*.toml"]
